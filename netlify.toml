[build]
  command = "rm -rf public && npm install axios googleapis gray-matter && hugo --gc --minify && node index-google.js && rm -f public/404.html"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.166.0"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# 3. Header khusus untuk /sitemap.rss
[[headers]]
  for = "/sitemap.rss"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

# 4. Header no-cache untuk /offline.html (PWA)
[[headers]]
  for = "/offline.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[build]
  command = "hugo --gc --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.166.0"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# 1. Redirect /index.xml ke /sitemap.rss (301)
[[redirects]]
  from = "/index.xml"
  to = "/sitemap.rss"
  status = 301
  force = true

# 2. Fallback / Catch-all (Mirip aturan terakhir di vercel.json)
# File yang ada di filesystem (seperti /offline.html, gambar, artikel) otomatis dilayani lebih dulu oleh Netlify sebelum kena aturan ini
[[redirects]]
  from = "/*"
  to = "/"
  status = 301
  force = false

# 3. Header khusus untuk /sitemap.rss
[[headers]]
  for = "/sitemap.rss"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

# 4. Header no-cache untuk /offline.html (PWA)
[[headers]]
  for = "/offline.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

{{/* layouts/_partials/get-yt-thumb.html */}}
{{- $ytID := "" -}}
{{- $content := .RawContent -}}
{{- $match := findRE `<div class="youtube-player" data-id="([^"]+)"` $content 1 -}}
{{- if $match -}}
  {{- $ytID = index $match 0 | replaceRE `<div class="youtube-player" data-id="([^"]+)"` "$1" -}}
{{- end -}}
{{- return $ytID -}}

<div class="article-navigation">
<div class="nav-prev">
        {{ with .PrevInSection }}
        <a href="{{ .Permalink }}">
            <span>← Post Sebelumnya</span>
            <span>{{ .Title }}</span>
        </a>
        {{ end }}
    </div>
    <div class="nav-next">
        {{ with .NextInSection }}
        <a href="{{ .Permalink }}">
            <span>Post Selanjutnya →</span>
            <span>{{ .Title }}</span>
        </a>
        {{ end }}
    </div>
</div>

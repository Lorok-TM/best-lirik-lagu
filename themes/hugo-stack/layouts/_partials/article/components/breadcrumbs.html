{{ if not .IsHome }}
<nav class="breadcrumb-nav" style="margin-bottom: 20px; font-size: 0.9rem;">
    <ol style="list-style: none; padding: 0; display: flex; gap: 8px;">
        <li><a href="{{ .Site.BaseURL }}">Home</a></li>
        <span>/</span>
        {{ range .Ancestors.Reverse }}
            {{ if .Title }}
                <li><a href="{{ .Permalink }}">{{ .Title }}</a></li>
                <span>/</span>
            {{ end }}
        {{ end }}
        <li style="color: var(--card-text-color-secondary);">{{ .Title }}</li>
    </ol>
</nav>
{{ end }}

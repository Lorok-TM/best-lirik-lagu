<div class="entry-content">
{{- $w := printf "<div class=\"table-wrapper\">${1}</div>" -}}
{{- $c := .Content | replaceRE "(<table>(?:.|\n)+?</table>)" $w -}}
{{- $c = $c | replaceRE "(</p>)\\s+(<p>)" "${1}${2}" -}}
{{- $c = $c | replaceRE "(<br\\s*/?>)\\s+" "${1}" -}}
{{- trim $c "\n\r " | safeHTML -}}
</div>

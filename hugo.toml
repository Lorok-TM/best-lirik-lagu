baseURL = "https://bestliriklagu.com"
locale = "id"
title = "Best Lirik Lagu"
theme = "hugo-stack"
disableHugoGeneratorInject = true

[permalinks]
  post = "/:slug/"

[[menu.main]]
  name = "Home"
  pageRef = "/"
  weight = 10

[[menu.main]]
  name = "Author"
  pageRef = "/author/"
  weight = 20

[[menu.main]]
  name = "Pages"
  pageRef = "/page/"
  weight = 20

[[menu.main]]
  name = "Posts"
  pageRef = "/post/"
  weight = 20

[[menu.main]]
  name = "Category"
  pageRef = "/categories/"
  weight = 20

[related]
  includeNewer = false
  threshold = 80
  toLower = true
[[related.indices]]
  name = "categories"
  weight = 100
[[related.indices]]
  name = "tags"
  weight = 80
  
[params]
  description = "Kumpulan lirik lagu terbaru dan terbaik para penyanyi dan musisi dari Daerah Sabang sampai Merauke Indonesia hingga Manca Negara."
  author = "Katrok"
  showRelated = true
  relatedLimit = 3
  
[params.homepage]
  layout = "page"
  showRecent = true
  recentLimit = 5
  showRecentHeader = true
  showFeatured = true
  featuredLimit = 5 
  showFeaturedHeader = true

[outputs]
    home = ["HTML", "RSS", "NewsSitemap"]
    page = ["HTML"]
    section = ["HTML", "RSS"]

[outputFormats.NewsSitemap]
  mediaType = "application/xml"
  baseName = "sitemap-news"
  isHTML = false

[minify]
  minifyOutput = true

[minify.tdewolff.html]
    keepQuotes = true

[modules]
  [modules.timeout]
    timeout = "1s"

[security]
  [security.http]
    allowedDomains = []

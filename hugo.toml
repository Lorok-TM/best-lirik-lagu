baseURL = 'https://best-lirik-lagu.vercel.app'
languageCode = 'id'
title = 'Best Lirik Lagu'
theme = "blowfish"

[permalinks]
  post = '/:slug/'

[related]
  includeNewer = true
  threshold = 10
  toLower = true
[[related.indices]]
  name = 'categories'
  weight = 100
[[related.indices]]
  name = 'date'
  weight = 10

[params]
  mainSections = ["post"]
  article.showRelated = true
  article.relatedLimit = 3
  homepage.layout = "card"
  homepage.showRecent = true
  homepage.showRecentItems = 12
  homepage.showRecentHeader = true
  homepage.cardView = true

[[menu.main]]
  name = "Home"
  pageRef = "/"
  weight = 10

[[menu.main]]
  name = "Semua Lirik"
  pageRef = "/post/"
  weight = 20

[[menu.main]]
  name = "Kategori"
  pageRef = "/categories/"
  weight = 30

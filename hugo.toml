baseURL = 'https://best-lirik-lagu.vercel.app'
languageCode = 'id'
title = 'Best Lirik Lagu'
theme = "blowfish"

[permalinks]
  post = '/:slug/'

[related]
  includeNewer = false
  threshold = 80
  toLower = true
[[related.indices]]
  name = 'categories'
  weight = 100
[[related.indices]]
  name = 'tags'
  weight = 80
  
[params]
  showRelated = true
  relatedLimit = 3

# 2. LOGIKA UTAMA HOMEPAGE (LAYOUT CARD CEKATAN + RECENT POSTS RAME)
[params.homepage]
  layout = "card"             # Tampilan kartu kothak-kothak modern cocok nggo lirik
  showRecent = true
  recentLimit = 12            # Langsung keki 12 list artikel neng ngarep ben ketok rame lan kebak
  showRecentHeader = true
  cardView = true
  
  showFeatured = true
  featuredLimit = 5 
  showFeaturedHeader = true

[[menu.main]]
  name = "Home"
  pageRef = "/"
  weight = 10

[[menu.main]]
  name = "Semua Lirik"
  pageRef = "/post/"
  weight = 20

[[menu.main]]
  name = "Kategori"
  pageRef = "/categories/"
  weight = 30

baseURL = 'https://best-lirik-lagu.vercel.app'
languageCode = 'id'
title = 'Best Lirik Lagu'

[permalinks]
  post = '/:slug/'

[related]
  includeNewer = false
  threshold = 80
  toLower = true
[[related.indices]]
  name = 'categories'
  weight = 100
[[related.indices]]
  name = 'tags'
  weight = 80
  
[params]
  showRelated = true
  relatedLimit = 3

[params.homepage]
  layout = "page"
  showRecent = true
  recentLimit = 5
  showRecentHeader = true
  showFeatured = true
  featuredLimit = 5 
  showFeaturedHeader = true


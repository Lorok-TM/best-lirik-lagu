baseURL = 'https://best-lirik-lagu.vercel.app'
languageCode = 'id'
title = 'Best Lirik Lagu'
theme = "blowfish"

[permalinks]
  post = '/:slug/'

[related]
  includeNewer = false
  threshold = 80
  toLower = true
[[related.indices]]
  name = 'categories'
  weight = 100
[[related.indices]]
  name = 'tags'
  weight = 80
  
[params]
  # Fitur umum Blowfish

[params.article]
  showRelated = true          # <--- Pindah mrene ben logikane nyambung neng artikel!
  relatedLimit = 3

# LOGIKA UTAMA HOMEPAGE (LAYOUT CARD CEKATAN + RECENT POSTS RAME)
[params.homepage]
layout = "card"
showRecent = true
recentLimit = 12
showRecentHeader = true
cardView = true
  
# Perbaikan Variabel Featured Blowfish sing asli:
showFeaturedItems = true
featuredLimit = 5 
showFeaturedHeader = true

# LOGIKA MENU NAVIGASI
[[menu.main]]
  name = "Home"
  pageRef = "/"
  weight = 10
[[menu.main]]
  name = "Semua Lirik"
  pageRef = "/post/"
  weight = 20
[[menu.main]]
  name = "Kategori"
  pageRef = "/categories/"
  weight = 30

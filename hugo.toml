baseURL = 'https://best-lirik-lagu.vercel.app'
languageCode = 'id'
title = 'Best Lirik Lagu'
theme = "blowfish"

[permalinks]
  post = '/:slug/'

[related]
  includeNewer = false
  threshold = 80
  toLower = true
[[related.indices]]
  name = 'keywords'
  weight = 100
[[related.indices]]
  name = 'tags'
  weight = 80

[params.homepage]
  layout = "profile"
  showRecent = true
  recentLimit = 5
  showRecentHeader = true

  showFeatured = true
  featuredLimit = 5
  showFeaturedHeader = true

[params]
  showRelated = true
  relatedLimit = 3

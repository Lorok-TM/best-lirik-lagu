baseURL = 'https://best-lirik-lagu.vercel.app'
languageCode = 'id'
title = 'Best Lirik Lagu'
theme = "blowfish"

[permalinks]
  post = '/:slug/'

[related]
  includeNewer = false
  threshold = 80
  toLower = true
[[related.indices]]
  name = 'keywords'
  weight = 100
[[related.indices]]
  name = 'tags'
  weight = 80

[params]
  # Ngaktifake mode blog supaya halaman ngarep nampilake daftar artikel
  homepage = { layout = "profile" } 
  
[params.homepage]
  showRecent = true          # Nampilake Recent Posts ing halaman ngarep
  recentLimit = 5            # Jumlah maksimal artikel sing muncul neng ngarep
  showRecentHeader = true    # Nampilake tulisan judul "Recent Posts"

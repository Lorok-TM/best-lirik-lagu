baseURL = 'https://vercel.app'
languageCode = 'id'
title = 'Best Lirik Lagu'
theme = "blowfish"

[permalinks]
  post = '/:slug/'

[related]
  includeNewer = true
  threshold = 10
  toLower = true
[[related.indices]]
  name = 'categories'
  weight = 100
[[related.indices]]
  name = 'date'
  weight = 10

[params]
  mainSections = ["post"]     # <--- Bagean penting sing nggugah Related & Card neng Home!

[params.article]
  showRelated = true
  relatedLimit = 3

[params.homepage]
  layout = "card"
  showRecent = true
  recentLimit = 12
  showRecentHeader = true
  cardView = true

[[menu.main]]
  name = "Home"
  pageRef = "/"
  weight = 10

[[menu.main]]
  name = "Semua Lirik"
  pageRef = "/post/"
  weight = 20

[[menu.main]]
  name = "Kategori"
  pageRef = "/categories/"
  weight = 30
